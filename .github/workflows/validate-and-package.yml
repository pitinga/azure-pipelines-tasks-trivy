name: Validate and package VSIX
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node 24 runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log('Node ' + process.version)"
      - name: Validate tasks
        run: npm run check
      - name: Install packaging CLI
        run: npm install --no-save tfx-cli@0.24.2
      - name: Create VSIX
        run: mkdir -p dist && npm run package:vsix
      - name: Verify Marketplace assets in VSIX
        run: npm run verify:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: trivy-azure-devops-vsix
          path: dist/*.vsix
          if-no-files-found: error
